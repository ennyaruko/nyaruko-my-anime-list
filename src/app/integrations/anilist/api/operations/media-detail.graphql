query MediaDetail($id: Int!) {
  Media(id: $id, type: ANIME) {
    id
    idMal
    title {
      romaji
      english
      native
    }
    coverImage {
      extraLarge
      large
      medium
    }
    bannerImage
    averageScore
    popularity
    isFavourite
    isAdult
    format
    source
    status
    episodes
    airingSchedule(notYetAired: true, page: 1, perPage: 10) {
      nodes {
        airingAt
        episode
      }
    }
    duration
    seasonYear
    startDate {
      year
      month
      day
    }
    endDate {
      year
      month
      day
    }
    genres
    description(asHtml: true)
    tags {
      name
      rank
    }
    mediaListEntry {
      id
      status
      score
      progress
    }
  }
}
