query MediaRecommendations(
  $id: Int!
  $page: Int!
  $perPage: Int!
  $sort: [RecommendationSort]
) {
  Media(id: $id, type: ANIME) {
    recommendations(page: $page, perPage: $perPage, sort: $sort) {
      pageInfo {
        hasNextPage
      }
      nodes {
        mediaRecommendation {
          ...RecommendedAnime
        }
      }
    }
  }
}
