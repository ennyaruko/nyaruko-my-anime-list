query MediaRecommendations($id: Int!, $page: Int!, $perPage: Int!) {
  Media(id: $id, type: ANIME) {
    recommendations(page: $page, perPage: $perPage, sort: RATING_DESC) {
      pageInfo {
        hasNextPage
      }
      nodes {
        mediaRecommendation {
          id
          type
          title {
            romaji
            english
            native
          }
          coverImage {
            large
            medium
          }
          averageScore
          isAdult
          format
          seasonYear
          status
          startDate {
            year
          }
          mediaListEntry {
            id
            status
            score
            progress
          }
        }
      }
    }
  }
}
