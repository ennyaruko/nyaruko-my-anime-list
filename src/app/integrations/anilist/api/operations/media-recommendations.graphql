query MediaRecommendations($id: Int!, $page: Int!, $perPage: Int!) {
  Media(id: $id, type: ANIME) {
    recommendations(page: $page, perPage: $perPage, sort: RATING_DESC) {
      pageInfo {
        hasNextPage
      }
      nodes {
        mediaRecommendation {
          ...RecommendedAnime
        }
      }
    }
  }
}
