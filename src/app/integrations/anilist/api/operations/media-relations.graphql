query MediaRelations($id: Int!) {
  Media(id: $id, type: ANIME) {
    relations {
      edges {
        relationType
        node {
          id
          type
          title {
            romaji
            english
            native
          }
          coverImage {
            large
            medium
          }
          averageScore
          popularity
          isAdult
          episodes
          duration
          genres
          tags {
            name
          }
          format
          seasonYear
          source
          status
          startDate {
            year
            month
            day
          }
          endDate {
            year
            month
            day
          }
          description
          bannerImage
          mediaListEntry {
            id
            status
            score
            progress
          }
        }
      }
    }
  }
}
