query MediaRelations($id: Int!) {
  Media(id: $id, type: ANIME) {
    relations {
      edges {
        relationType
        node {
          id
          type
          title {
            romaji
            english
            native
          }
          coverImage {
            large
            medium
          }
          averageScore
          isAdult
          format
          seasonYear
          status
          startDate {
            year
          }
          mediaListEntry {
            id
            status
            score
            progress
          }
        }
      }
    }
  }
}
