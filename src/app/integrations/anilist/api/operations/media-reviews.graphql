query MediaReviews($id: Int!, $page: Int!, $perPage: Int!) {
  Media(id: $id, type: ANIME) {
    reviews(page: $page, perPage: $perPage, sort: RATING_DESC) {
      pageInfo {
        hasNextPage
      }
      nodes {
        id
        summary
        body(asHtml: true)
        rating
        ratingAmount
        score
        createdAt
        user {
          name
          avatar {
            large
          }
        }
      }
    }
  }
}
