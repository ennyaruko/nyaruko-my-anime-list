query ViewerAnimeList($userId: Int!, $type: MediaType = ANIME) {
  MediaListCollection(userId: $userId, type: $type) {
    lists {
      status
      entries {
        status
        score
        progress
        media {
          id
          title {
            romaji
            english
            native
          }
          coverImage {
            large
            medium
          }
          averageScore
          episodes
          duration
          startDate {
            year
            month
            day
          }
          endDate {
            year
            month
            day
          }
          seasonYear
          format
          source
          genres
          type
          description
          bannerImage
        }
      }
    }
  }
}
